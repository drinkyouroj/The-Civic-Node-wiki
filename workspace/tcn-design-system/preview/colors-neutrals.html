<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #557fa3; font-family: 'Courier Prime', monospace; padding: 18px; box-sizing: border-box; }
  .swatch-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; box-sizing: border-box; }
  .sw .name { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1; margin-bottom: 4px; }
  .sw .hex  { font-size: 9px; letter-spacing: 0.05em; opacity: 0.7; line-height: 1; }
  .label-row { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin: 0 0 12px 0; }
</style>
</head>
<body>
  <div class="label-row"><span>Neutrals · Surfaces & Borders</span><span>·</span></div>
  <div class="swatch-row">
    <div class="sw" style="background:#0D0D0F;color:#557fa3;border:1px solid #2A3A4E;"><div class="name">Black</div><div class="hex">#0D0D0F</div></div>
    <div class="sw" style="background:#13131A;color:#557fa3;border:1px solid #2A3A4E;"><div class="name">Ink</div><div class="hex">#13131A</div></div>
    <div class="sw" style="background:#1A1A24;color:#557fa3;border:1px solid #2A3A4E;"><div class="name">Ink 2</div><div class="hex">#1A1A24</div></div>
    <div class="sw" style="background:#F6F6F8;color:#3A6A8F;"><div class="name">Paper</div><div class="hex">#F6F6F8</div></div>
    <div class="sw" style="background:#E4E4EA;color:#3A6A8F;"><div class="name">Paper 2</div><div class="hex">#E4E4EA</div></div>
    <div class="sw" style="background:#9898B0;color:#0d0d0f;"><div class="name">Mute</div><div class="hex">#9898B0</div></div>
  </div>
</body></html>
