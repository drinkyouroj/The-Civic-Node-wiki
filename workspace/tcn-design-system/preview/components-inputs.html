<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #557fa3; font-family: 'Courier Prime', monospace; padding: 18px 22px; box-sizing: border-box; }
  .meta { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .field { display:flex; flex-direction:column; gap: 8px; }
  .lab { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #485070; }
  input.tcn-input {
    background: #13131A; color: #b4c8dc; border: 1px solid #2A3A4E;
    padding: 12px 14px; font-family: 'Courier Prime', monospace; font-size: 14px; outline: none;
    border-radius: 0;
  }
  input.tcn-input:focus { border-color: #557FA3; }
  .compose {
    background: #13131A; border: 1px solid #2A3A4E; padding: 12px 14px;
    font-family: 'Courier Prime', monospace; font-size: 14px; color: #557fa3;
    display: flex; align-items: center; gap: 10px;
  }
  .compose .caret { width: 8px; height: 14px; background: #557fa3; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="meta">Inputs · slate hairline · 1px focus · no radius</div>
  <div class="grid">
    <div class="field">
      <div class="lab">Email</div>
      <input class="tcn-input" type="email" value="reader@example.com">
    </div>
    <div class="field">
      <div class="lab">Search archive</div>
      <input class="tcn-input" placeholder="Treasury, stablecoin, …">
    </div>
    <div class="field" style="grid-column: 1 / -1;">
      <div class="lab">Composer · with caret</div>
      <div class="compose">→ The Treasury has signalled it three times now<span class="caret"></span></div>
    </div>
  </div>
</body></html>
