<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #557fa3; font-family: 'Courier Prime', monospace; padding: 18px 22px; box-sizing: border-box; }
  .meta { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 18px; align-items: center; }
  .glyph { font-size: 28px; color: #557fa3; text-align:center; line-height:1; }
  .lab { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #485070; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <div class="meta">Iconography · ASCII glyphs (the only icon set)</div>
  <div class="grid">
    <div><div class="glyph">→</div><div class="lab">Forward</div></div>
    <div><div class="glyph">←</div><div class="lab">Back</div></div>
    <div><div class="glyph">↗</div><div class="lab">External</div></div>
    <div><div class="glyph">·</div><div class="lab">Separator</div></div>
    <div><div class="glyph">—</div><div class="lab">Em-dash</div></div>
    <div><div class="glyph">[+]</div><div class="lab">Add</div></div>
    <div><div class="glyph">[×]</div><div class="lab">Close</div></div>
    <div><div class="glyph">№</div><div class="lab">Issue</div></div>
  </div>
</body></html>
