<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #557fa3; font-family: 'Courier Prime', monospace; padding: 0; box-sizing: border-box; min-height: 220px; display:flex; flex-direction: column; }
  .meta { padding: 12px 22px; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; }
  .masthead { padding: 14px 22px; display:flex; align-items:center; justify-content: space-between; border-bottom: 1px solid #2A3A4E;}
  .left { display:flex; align-items:center; gap: 14px; }
  .word { font-size: 22px; letter-spacing: -0.5px; color: #557fa3; }
  .nav { display:flex; gap: 22px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #485070;}
  .nav a { color: #485070; text-decoration: none; }
  .nav a.active { color: #557fa3; }
  .row { padding: 12px 22px; display:flex; gap: 22px; }
  .hairline { height: 1px; background: linear-gradient(90deg, rgba(42,58,78,0) 0%, #2A3A4E 15%, #2A3A4E 85%, rgba(42,58,78,0) 100%); margin: 0 22px; }
</style>
</head>
<body>
  <div class="meta">Masthead · home / archive / about / subscribe</div>

    <div class="left">
      <svg width="24" height="26" viewBox="-3 -3 120 130" fill="none" stroke="#557fa3" stroke-width="6" stroke-linecap="round">
        <line x1="33" y1="0" x2="81" y2="0"/>
        <line x1="57" y1="0" x2="57" y2="77"/>
        <line x1="57" y1="77" x2="0" y2="110"/>
        <line x1="57" y1="77" x2="114" y2="110"/>
        <circle cx="57" cy="77" r="14" fill="#557fa3" stroke="none"/>
      </svg>
      <div class="word">The Civic Node</div>
    </div>
    <div class="nav">
      <a class="active">Home</a><a>Archive</a><a>About</a><a>Subscribe →</a>
    </div>
  </div>
  <div class="row">
    <div style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color:#485070;">EST. 2025</div>
    <div style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color:#485070;">·</div>
    <div style="font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color:#485070;">DRINKYOUROJ.SUBSTACK.COM</div>
  </div>
  <div class="hairline"></div>
