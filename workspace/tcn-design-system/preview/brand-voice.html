<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #485070; font-family: 'Courier Prime', monospace; padding: 18px 22px; box-sizing: border-box; }
  .meta { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin-bottom: 12px; }
  blockquote { margin: 0; padding: 0; }
  .pull {
    border-left: 1px solid #2A3A4E; padding: 12px 18px;
    color: #b4c8dc; font-size: 18px; line-height: 1.45; letter-spacing: -0.005em;
  }
  .source { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin-top: 10px; padding-left: 18px; }
</style>
</head>
<body>
  <div class="meta">Voice specimen · pull quote</div>
  <blockquote class="pull">If you could have gotten this from a Twitter thread, it should not have been published here.</blockquote>
  <div class="source">— Editorial standard</div>
</body></html>
