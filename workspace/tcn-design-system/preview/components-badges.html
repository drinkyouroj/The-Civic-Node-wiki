<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #557fa3; font-family: 'Courier Prime', monospace; padding: 18px 22px; box-sizing: border-box; }
  .meta { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin-bottom: 18px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .badge { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; padding: 4px 8px; border: 1px solid #2A3A4E; color:#557fa3;}
  .badge.solid { background: #557FA3; color: #0d0d0f; border: 0; }
  .badge.dim { color: #485070; border-color: #3D3D60; }
  .tag-line { font-size: 13px; letter-spacing: 0.27em; text-transform: uppercase; color: #557fa3; }
  .lab { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: #485070; flex: 0 0 100px; }
</style>
</head>
<body>
  <div class="meta">Tags & Badges · sentence-as-tag · no rounded chips</div>
  <div class="stack">
    <div class="row"><div class="lab">Issue mark</div><div class="badge solid">EST. 2025</div><div class="badge">DISPATCH №042</div><div class="badge dim">DRAFT</div></div>
    <div class="row"><div class="lab">Topic line</div><div class="tag-line">POLITICS · INFRASTRUCTURE · AI</div></div>
    <div class="row"><div class="lab">Status</div><div class="badge dim">[01] CONTEXT</div><div class="badge dim">[02] FRAME</div><div class="badge dim">[03] CALL</div></div>
  </div>
</body></html>
