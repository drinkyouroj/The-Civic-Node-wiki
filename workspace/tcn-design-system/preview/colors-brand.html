<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html, body { margin: 0; }
  body { background: #0d0d0f; color: #557fa3; font-family: 'Courier Prime', monospace; padding: 18px; box-sizing: border-box; }
  .card { width: 100%; }
  .swatch-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1.4 / 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; box-sizing: border-box; }
  .sw .name { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; line-height: 1; margin-bottom: 4px; }
  .sw .hex  { font-size: 9px; letter-spacing: 0.05em; opacity: 0.7; line-height: 1; }
  .label-row { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: #485070; margin: 0 0 12px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="label-row">
      <span>06 — Color Palette · Brand Slates</span>
      <span>·</span>
    </div>
    <div class="swatch-row">
      <div class="sw" style="background:#557FA3;color:#0d0d0f;"><div class="name">Slate 400</div><div class="hex">#557FA3</div></div>
      <div class="sw" style="background:#3A6A8F;color:#f6f6f8;"><div class="name">Slate 600</div><div class="hex">#3A6A8F</div></div>
      <div class="sw" style="background:#2E5A7E;color:#f6f6f8;"><div class="name">Slate 700</div><div class="hex">#2E5A7E</div></div>
      <div class="sw" style="background:#2A3A4E;color:#557FA3;"><div class="name">Slate 800</div><div class="hex">#2A3A4E</div></div>
      <div class="sw" style="background:#485070;color:#f6f6f8;"><div class="name">Twilight</div><div class="hex">#485070</div></div>
      <div class="sw" style="background:#3D3D60;color:#9898b0;"><div class="name">Twilight 2</div><div class="hex">#3D3D60</div></div>
      <div class="sw" style="background:linear-gradient(135deg,rgba(85,127,163,0.14),rgba(85,127,163,0));color:#557fa3;border:1px solid #2A3A4E;"><div class="name">Glow · 14%</div><div class="hex">rgba(85,127,163,.14)</div></div>
    </div>
  </div>
</body></html>
