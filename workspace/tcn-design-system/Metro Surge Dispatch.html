U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2e444307-5226-4c7e-ae6a-a573f21cf294\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f14d7b2b-b067-498f-96f3-eaf376f4d7af\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"eb5577b3-7ec4-42a1-b3d4-01fbcd1e3928\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Courier Prime';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d46e9524-eb71-4ae2-8993-a707cf90c428\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ── Brand colors ────────────────────────────────────────────── */\n  --tcn-slate-400:    rgb(85, 127, 163);   /* #557FA3 — brand · dark mode */\n  --tcn-slate-500:    rgb(72, 105, 134);   /* #486986 — slate mid */\n  --tcn-slate-600:    rgb(58, 106, 143);   /* #3A6A8F — brand · light mode */\n  --tcn-slate-700:    rgb(46, 90, 126);    /* #2E5A7E — slate deep */\n  --tcn-slate-800:    rgb(42, 58, 78);     /* #2A3A4E — divider / hairline */\n  --tcn-slate-900:    rgb(32, 44, 60);     /* #202C3C — slate inkwell */\n  --tcn-twilight:     rgb(72, 80, 112);    /* #485070 — meta / metadata text on dark */\n  --tcn-twilight-2:   rgb(61, 61, 96);     /* #3D3D60 — divider on dark */\n\n  /* ── Neutrals — dark surfaces ────────────────────────────────── */\n  --tcn-black:        rgb(13, 13, 15);     /* #0D0D0F — canvas */\n  --tcn-ink:          rgb(19, 19, 26);     /* #13131A — surface */\n  --tcn-ink-2:        rgb(26, 26, 36);     /* #1A1A24 — raised surface */\n\n  /* ── Neutrals — light surfaces ───────────────────────────────── */\n  --tcn-paper:        rgb(246, 246, 248);  /* #F6F6F8 — light canvas */\n  --tcn-paper-2:      rgb(228, 228, 234);  /* #E4E4EA — light border */\n  --tcn-paper-3:      rgb(228, 228, 236);  /* #E4E4EC — alt border */\n  --tcn-mute:         rgb(152, 152, 176);  /* #9898B0 — meta on light */\n\n  /* ── Tints (alpha) ───────────────────────────────────────────── */\n  --tcn-glow:         rgba(85, 127, 163, 0.14);  /* radial glow on dark */\n  --tcn-haze:         rgba(58, 106, 143, 0.10);  /* secondary glow */\n\n  /* ── Semantic — DARK MODE (default brand context) ────────────── */\n  --bg:               var(--tcn-black);\n  --bg-raised:        var(--tcn-ink);\n  --bg-sunken:        var(--tcn-ink-2);\n  --fg:               var(--tcn-slate-400);\n  --fg-strong:        rgb(180, 200, 220);\n  --fg-muted:         var(--tcn-twilight);\n  --fg-faint:         var(--tcn-twilight-2);\n  --border:           var(--tcn-twilight-2);\n  --hairline:         var(--tcn-slate-800);\n  --accent:           var(--tcn-slate-400);\n  --node:             var(--tcn-slate-400);\n\n  /* ── Type stack ──────────────────────────────────────────────── */\n  --font-mono: 'Courier Prime', 'Courier New', ui-monospace, SFMono-Regular,\n               Menlo, Consolas, monospace;\n  --font-body: 'Courier Prime', 'Courier New', ui-monospace, monospace;\n  --font-display: 'Courier Prime', 'Courier New', monospace;\n\n  /* ── Type scale ──────────────────────────────────────────────── */\n  /* Built from the figma frames: 9 / 11 / 13 / 16 / 28 / 54 / 90 / 166 */\n  --fs-micro:   9px;    /* fine print, image meta */\n  --fs-meta:    11px;   /* labels, tags, EST. 2025 */\n  --fs-tag:     13px;   /* taglines (POLITICS · INFRASTRUCTURE · …) */\n  --fs-body:    16px;   /* body copy */\n  --fs-lead:    20px;   /* lead paragraph */\n  --fs-h3:      28px;   /* section header */\n  --fs-h2:      54px;   /* lockup */\n  --fs-h1:      90px;   /* cover wordmark */\n  --fs-mega:    166px;  /* full-bleed wordmark */\n\n  --tracking-meta: 0.10em;     /* meta labels — wide tracking */\n  --tracking-tag:  0.27em;     /* tagline — very wide */\n  --tracking-tight: -0.025em;  /* display sizes — tight */\n\n  /* ── Spacing (8pt-ish, but anchored on 4) ────────────────────── */\n  --s-0:  0;\n  --s-1:  4px;\n  --s-2:  8px;\n  --s-3:  12px;\n  --s-4:  16px;\n  --s-5:  20px;\n  --s-6:  24px;\n  --s-7:  32px;\n  --s-8:  40px;\n  --s-9:  48px;\n  --s-10: 64px;\n  --s-11: 80px;\n  --s-12: 120px;\n\n  /* ── Radii — terminals don't round much ──────────────────────── */\n  --r-0: 0;            /* default — flat, terminal */\n  --r-1: 2px;          /* hairline rounding for inputs */\n  --r-pill: 999px;     /* circular nodes only */\n\n  /* ── Hairlines & dividers ────────────────────────────────────── */\n  --hairline-w: 1px;\n  --stroke-mark: 3.5px;     /* mark line weight at 114px wide */\n\n  /* ── Motion ──────────────────────────────────────────────────── */\n  --ease: cubic-bezier(0.2, 0, 0, 1);\n  --dur-fast: 120ms;\n  --dur-base: 200ms;\n  --dur-slow: 360ms;\n}\n\n/* ── Light-mode override (used on light surfaces) ──────────────── */\n.tcn-light {\n  --bg:        var(--tcn-paper);\n  --bg-raised: #ffffff;\n  --bg-sunken: var(--tcn-paper-2);\n  --fg:        var(--tcn-slate-600);\n  --fg-strong: var(--tcn-slate-900);\n  --fg-muted:  var(--tcn-mute);\n  --fg-faint:  var(--tcn-paper-2);\n  --border:    var(--tcn-paper-2);\n  --hairline:  var(--tcn-paper-3);\n  --accent:    var(--tcn-slate-600);\n  --node:      var(--tcn-slate-600);\n}\n\n/* ─────────────────────────────────────────────────────────────────\n   Semantic element styling. Use these as a base when mocking.\n   ───────────────────────────────────────────────────────────────── */\n\n.tcn body, .tcn {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n}\n\n.tcn h1, .tcn .h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h1);\n  line-height: 1.0;\n  letter-spacing: var(--tracking-tight);\n  color: var(--accent);\n  font-weight: 400;\n  margin: 0;\n}\n\n.tcn h2, .tcn .h2 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h2);\n  line-height: 1.05;\n  letter-spacing: var(--tracking-tight);\n  color: var(--accent);\n  font-weight: 400;\n  margin: 0;\n}\n\n.tcn h3, .tcn .h3 {\n  font-family: var(--font-display);\n  font-size: var(--fs-h3);\n  line-height: 1.15;\n  letter-spacing: -0.01em;\n  color: var(--fg-strong);\n  font-weight: 700;\n  margin: 0;\n}\n\n.tcn .lead { font-size: var(--fs-lead); line-height: 1.55; color: var(--fg-strong); }\n.tcn p     { margin: 0 0 1em 0; }\n\n.tcn .meta {\n  font-family: var(--font-mono);\n  font-size: var(--fs-meta);\n  line-height: 1;\n  letter-spacing: var(--tracking-meta);\n  text-transform: uppercase;\n  color: var(--fg-muted);\n}\n\n.tcn .tag {\n  font-family: var(--font-mono);\n  font-size: var(--fs-tag);\n  line-height: 1;\n  letter-spacing: var(--tracking-tag);\n  text-transform: uppercase;\n  color: var(--fg);\n}\n\n.tcn .micro {\n  font-family: var(--font-mono);\n  font-size: var(--fs-micro);\n  letter-spacing: 0.05em;\n  color: var(--fg-muted);\n}\n\n.tcn code, .tcn .code {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n  background: var(--bg-sunken);\n  padding: 0.05em 0.4em;\n  border-radius: var(--r-1);\n  color: var(--fg-strong);\n}\n\n.tcn a {\n  color: var(--accent);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 2px;\n  text-decoration-color: var(--hairline);\n  transition: color var(--dur-fast) var(--ease),\n              text-decoration-color var(--dur-fast) var(--ease);\n}\n.tcn a:hover { text-decoration-color: var(--accent); }\n\n.tcn hr.hairline {\n  border: 0;\n  height: 1px;\n  background: linear-gradient(\n    90deg,\n    rgba(42, 58, 78, 0) 0%,\n    var(--hairline) 15%,\n    var(--hairline) 85%,\n    rgba(42, 58, 78, 0) 100%\n  );\n  margin: var(--s-7) 0;\n}\n\n/* Selection: slate, not blue */\n.tcn ::selection {\n  background: var(--tcn-slate-700);\n  color: var(--tcn-paper);\n}\n<\u002Fstyle>\n<style>/* slides/slides.css — deck-specific tokens layered on top of colors_and_type.css */\n\n/* deck-stage host — the shell sets aspect-ratio/scale; we set the canvas */\ndeck-stage {\n  --deck-bg: #0d0d0f;\n  background: var(--deck-bg);\n}\n\ndeck-stage > section {\n  background: var(--deck-bg);\n  color: var(--tcn-slate-400);\n  font-family: var(--font-mono);\n  width: 1920px;\n  height: 1080px;\n  position: relative;\n  overflow: hidden;\n  box-sizing: border-box;\n  padding: 156px 120px 132px;\n}\n\n/* ── Slide-tier type — re-anchored to 1080p ─────────────────────── */\n:root {\n  --slide-mega:    220px;   /* full-bleed wordmark */\n  --slide-h1:      140px;   /* title */\n  --slide-h2:       96px;   /* section */\n  --slide-h3:       64px;   /* slide title */\n  --slide-lead:     40px;   /* lead body */\n  --slide-body:     30px;   /* body */\n  --slide-kicker:   22px;   /* kicker / meta */\n  --slide-micro:    18px;   /* fine print, chart axis */\n}\n\n/* ── Standing furniture (every slide) ──────────────────────────── */\n.sl-kicker {\n  font-family: var(--font-mono);\n  font-size: var(--slide-kicker);\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--tcn-twilight);\n}\n.sl-mark-row {\n  position: absolute; top: 56px; left: 120px; right: 120px;\n  display: flex; align-items: center; justify-content: space-between;\n}\n.sl-mark-brand {\n  display: flex; align-items: center; gap: 18px;\n  color: var(--tcn-twilight);\n}\n.sl-mark-brand .word {\n  font-family: var(--font-mono); font-size: 22px;\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--tcn-twilight);\n}\n.sl-foot-row {\n  position: absolute; bottom: 56px; left: 120px; right: 120px;\n  display: flex; align-items: center; justify-content: space-between;\n  font-family: var(--font-mono); font-size: var(--slide-micro);\n  letter-spacing: 0.18em; text-transform: uppercase; color: var(--tcn-twilight);\n}\n\n/* ── Hairlines — animate-able on slide enter ───────────────────── */\n.sl-hairline {\n  height: 1px; background: linear-gradient(90deg,\n    rgba(42,58,78,0) 0%, var(--tcn-slate-800) 15%,\n    var(--tcn-slate-800) 85%, rgba(42,58,78,0) 100%);\n  transform-origin: center; transform: scaleX(0);\n  animation: sl-draw 800ms var(--ease) forwards 200ms;\n}\n@keyframes sl-draw { to { transform: scaleX(1); } }\n\n/* ── Reveals — staged fade-up on slide enter ───────────────────── */\n.sl-reveal      { opacity: 0; transform: translateY(8px);\n                  animation: sl-rev 600ms var(--ease) forwards 200ms; }\n.sl-reveal-2    { animation-delay: 500ms; }\n.sl-reveal-3    { animation-delay: 800ms; }\n.sl-reveal-4    { animation-delay: 1100ms; }\n@keyframes sl-rev { to { opacity: 1; transform: translateY(0); } }\n\n/* Mark pulse — used on title + end-card */\n.sl-mark-pulse svg .node, .sl-mark-pulse circle.node {\n  transform-origin: 57px 77px;\n  animation: sl-pulse 2400ms var(--ease) infinite;\n}\n@keyframes sl-pulse {\n  0%, 100% { opacity: 1;   transform: scale(1); }\n  40%      { opacity: 0.55; transform: scale(0.92); }\n}\n\n/* Caret — 1Hz square-wave blink */\n.sl-caret { display: inline-block; width: 0.6ch; height: 1em;\n            background: var(--tcn-slate-400); margin-left: 0.2ch;\n            transform: translateY(0.1em);\n            animation: sl-blink 1s steps(1) infinite; }\n@keyframes sl-blink { 50% { opacity: 0; } }\n\n/* ── Layout: Title ─────────────────────────────────────────────── */\n.sl-title { display: grid; place-items: center; text-align: center; }\n.sl-title h1 {\n  font-family: var(--font-display);\n  font-size: var(--slide-h1); line-height: 1; letter-spacing: -0.025em;\n  color: var(--tcn-slate-400); margin: 32px 0 0 0; max-width: 22ch;\n}\n.sl-title .sl-tag {\n  font-family: var(--font-mono); font-size: 26px; letter-spacing: 0.27em;\n  text-transform: uppercase; color: var(--tcn-slate-400); margin-top: 36px;\n}\n.sl-title-mark { width: 200px; height: 220px; }\n\n/* ── Layout: Section divider ───────────────────────────────────── */\n.sl-section { display: grid; align-content: center; padding-left: 120px; }\n.sl-section .num {\n  font-family: var(--font-mono); font-size: 32px; letter-spacing: 0.18em;\n  color: var(--tcn-slate-400); margin-bottom: 24px;\n}\n.sl-section h2 {\n  font-family: var(--font-display); font-size: var(--slide-h2); line-height: 1;\n  letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0 0 32px 0;\n  max-width: 22ch;\n}\n.sl-section .desc { font-size: var(--slide-lead); line-height: 1.45; color: var(--tcn-twilight); max-width: 32ch; }\n\n/* ── Layout: Lead (long-form text body) ────────────────────────── */\n.sl-lead { display: grid; grid-template-rows: auto auto; gap: 48px; align-content: center; }\n.sl-lead h3 {\n  font-family: var(--font-display); font-size: var(--slide-h3); line-height: 1.05;\n  letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0; max-width: 22ch;\n}\n.sl-lead p {\n  font-size: var(--slide-lead); line-height: 1.5; color: var(--tcn-slate-400);\n  max-width: 32ch; margin: 0;\n}\n\n/* ── Layout: Frame Numbered (the [01]/[02]/[03] grid) ──────────── */\n.sl-frames { display: grid; grid-template-rows: auto auto; gap: 72px; align-content: center; }\n.sl-frames-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 64px; align-items: stretch; }\n.sl-frame { padding: 0 0 0 36px; border-left: 1px solid var(--tcn-slate-800); }\n.sl-frame .n {\n  font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.18em;\n  color: var(--tcn-slate-400); display: block; margin-bottom: 18px;\n}\n.sl-frame h4 {\n  font-family: var(--font-display); font-size: 44px; line-height: 1.05;\n  letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0 0 18px 0;\n}\n.sl-frame p {\n  font-size: 24px; line-height: 1.5; color: var(--tcn-twilight);\n  margin: 0;\n}\n\n/* ── Layout: Quote / pull ──────────────────────────────────────── */\n.sl-quote { display: grid; place-content: center; }\n.sl-quote blockquote {\n  border-left: 1px solid var(--tcn-slate-800); padding-left: 64px; margin: 0;\n  max-width: 1500px;\n}\n.sl-quote .body {\n  font-family: var(--font-display); font-size: 72px; line-height: 1.15;\n  letter-spacing: -0.025em; color: var(--tcn-slate-400);\n  text-wrap: balance;\n}\n.sl-quote .src {\n  font-family: var(--font-mono); font-size: var(--slide-kicker);\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--tcn-twilight); margin-top: 36px;\n}\n\n/* ── Layout: Compare (two-column) ──────────────────────────────── */\n.sl-compare { display: grid; grid-template-rows: auto 1fr; gap: 48px; }\n.sl-compare-cols { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 80px; }\n.sl-compare-cols .vrule {\n  background: linear-gradient(rgba(42,58,78,0) 0%,\n    var(--tcn-slate-800) 30%, var(--tcn-slate-800) 70%, rgba(42,58,78,0) 100%);\n}\n.sl-compare-col h5 {\n  font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.18em;\n  text-transform: uppercase; color: var(--tcn-twilight); margin: 0 0 28px 0;\n  font-weight: 700;\n}\n.sl-compare-col h6 {\n  font-family: var(--font-display); font-size: 56px; line-height: 1.05;\n  letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0 0 24px 0;\n  font-weight: 400;\n}\n.sl-compare-col p {\n  font-size: 26px; line-height: 1.5; color: var(--tcn-twilight); margin: 0;\n}\n\n/* ── Layout: Data ──────────────────────────────────────────────── */\n.sl-data { display: grid; grid-template-rows: auto 1fr auto; gap: 36px; align-content: center; }\n.sl-data h3 {\n  font-family: var(--font-display); font-size: var(--slide-h3); line-height: 1.05;\n  letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0;\n}\n.sl-data .caption {\n  font-family: var(--font-mono); font-size: var(--slide-micro);\n  letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--tcn-twilight);\n}\n.sl-chart { width: 100%; height: 100%; }\n.sl-chart .axis { stroke: var(--tcn-slate-800); stroke-width: 1; }\n.sl-chart .grid { stroke: var(--tcn-slate-800); stroke-width: 1; stroke-dasharray: 2 6; }\n.sl-chart .series-1 { fill: none; stroke: var(--tcn-slate-400); stroke-width: 3; }\n.sl-chart .series-2 { fill: none; stroke: var(--tcn-twilight); stroke-width: 2; stroke-dasharray: 6 6; }\n.sl-chart .label  { font-family: var(--font-mono); font-size: 18px; letter-spacing: 0.10em; text-transform: uppercase; fill: var(--tcn-twilight); }\n.sl-chart .pt     { fill: var(--tcn-slate-400); }\n.sl-chart .anno   { font-family: var(--font-mono); font-size: 22px; fill: var(--tcn-slate-400); }\n.sl-chart-draw    { stroke-dasharray: 4000; stroke-dashoffset: 4000;\n                    animation: sl-trace 1600ms var(--ease) forwards 600ms; }\n@keyframes sl-trace { to { stroke-dashoffset: 0; } }\n\n/* ── Layout: End-card / Disclosure ─────────────────────────────── */\n.sl-end { display: grid; grid-template-rows: auto 1fr auto; gap: 56px; }\n.sl-end h2 {\n  font-family: var(--font-display); font-size: 88px; line-height: 1.05;\n  letter-spacing: -0.025em; color: var(--tcn-slate-400); margin: 0; max-width: 22ch;\n}\n.sl-disclosure {\n  border: 1px solid var(--tcn-slate-800); padding: 36px 48px;\n  font-size: 24px; line-height: 1.6; color: var(--tcn-twilight); max-width: 60ch;\n}\n.sl-disclosure b {\n  display: block; color: var(--tcn-slate-400); font-weight: 700;\n  font-family: var(--font-mono); font-size: 18px;\n  letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 14px;\n}\n.sl-end-cta {\n  display: flex; align-items: baseline; gap: 24px;\n  font-family: var(--font-mono); font-size: 28px;\n  letter-spacing: 0.18em; text-transform: uppercase; color: var(--tcn-slate-400);\n}\n.sl-end-cta .url { color: var(--tcn-slate-400); }\n.sl-end-cta .arr { color: var(--tcn-slate-400); }\n\n/* ── Layout: Full-bleed mark / wordmark ────────────────────────── */\n.sl-mega { display: grid; place-content: center; text-align: center; }\n.sl-mega .word {\n  font-family: var(--font-display); font-size: 200px; line-height: 1;\n  letter-spacing: -0.025em; color: var(--tcn-slate-400);\n}\n\n/* Glow halos behind mark on title + end */\n.sl-glow {\n  position: absolute; pointer-events: none;\n  background: radial-gradient(rgba(85,127,163,0.14) 0%, rgba(85,127,163,0) 60%);\n  border-radius: 50%;\n}\n<\u002Fstyle>\n<script src=\"99a07365-4608-4453-af59-78bb4455664f\"><\u002Fscript>\n<style>\n  html, body { margin: 0; background: #050507; }\n\n  /* ── Local extensions for this dispatch ─────────────────────── */\n  .ms-numgrid {\n    display: grid;\n    grid-template-columns: 1fr 1px 1fr 1px 1fr;\n    gap: 64px;\n    align-items: stretch;\n  }\n  .ms-numgrid .vrule {\n    background: linear-gradient(rgba(42,58,78,0) 0%,\n      var(--tcn-slate-800) 30%, var(--tcn-slate-800) 70%, rgba(42,58,78,0) 100%);\n  }\n  .ms-numgrid .col {\n    display: grid; grid-template-rows: auto auto auto; gap: 24px; align-content: center;\n  }\n  .ms-numgrid .col .lab {\n    font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.18em;\n    text-transform: uppercase; color: var(--tcn-twilight); margin: 0;\n  }\n  .ms-numgrid .col .big {\n    font-family: var(--font-display); font-size: 200px; line-height: 0.95;\n    letter-spacing: -0.03em; color: var(--tcn-slate-400); margin: 0;\n  }\n  .ms-numgrid .col .big.dim { color: var(--tcn-twilight); }\n  .ms-numgrid .col .sub {\n    font-size: 26px; line-height: 1.45; color: var(--tcn-twilight); margin: 0; max-width: 22ch;\n  }\n  .ms-numgrid .col .sub strong { color: var(--tcn-slate-400); font-weight: 400; }\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"tcn\">\n\n\n<deck-stage>\n\n  <!-- 01 — Title ─────────────────────────────────────────────── -->\n  <section data-screen-label=\"01 Title\" class=\"sl-title\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\">\n        <span class=\"word\">EST. 2025<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sl-kicker\">DISPATCH №047<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sl-glow\" style=\"left: 50%; top: 50%; width: 1400px; height: 1400px; transform: translate(-50%,-50%);\"><\u002Fdiv>\n\n    <div class=\"sl-mark-pulse sl-reveal\">\n      <svg class=\"sl-title-mark\" viewBox=\"-3 -3 120 130\" fill=\"none\" stroke=\"#557fa3\" stroke-width=\"3.5\" stroke-linecap=\"round\">\n        <line x1=\"33\" y1=\"0\" x2=\"81\" y2=\"0\"><\u002Fline>\n        <line x1=\"57\" y1=\"0\" x2=\"57\" y2=\"77\"><\u002Fline>\n        <line x1=\"57\" y1=\"77\" x2=\"0\" y2=\"110\"><\u002Fline>\n        <line x1=\"57\" y1=\"77\" x2=\"114\" y2=\"110\"><\u002Fline>\n        <circle class=\"node\" cx=\"57\" cy=\"77\" r=\"10\" fill=\"#557fa3\" stroke=\"none\"><\u002Fcircle>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <h1 class=\"sl-reveal sl-reveal-2\" style=\"font-size: 116px; line-height: 1.04; max-width: none;\">3,000 arrests.<br>335 names.<br>One court order.<\u002Fh1>\n    <div class=\"sl-tag sl-reveal sl-reveal-3\">METRO SURGE · ACCOUNTABILITY · ON THE RECORD<\u002Fdiv>\n\n    <div class=\"sl-foot-row\">\n      <span>The Civic Node<\u002Fspan>\n      <span>2026·05·03 · 14 MIN<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 — Section [01] CONTEXT ─────────────────────────────── -->\n  <section data-screen-label=\"02 Context divider\" class=\"sl-section\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">PART ONE OF THREE<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"num sl-reveal\">[01]<\u002Fdiv>\n    <h2 class=\"sl-reveal sl-reveal-2\">Context.<span class=\"sl-caret\"><\u002Fspan><\u002Fh2>\n    <div class=\"sl-hairline\" style=\"max-width: 720px; margin: 8px 0 32px 0;\"><\u002Fdiv>\n    <p class=\"desc sl-reveal sl-reveal-3\">\n      The immigration story is the surface story. The accountability\n      infrastructure beneath it is what May 1 actually tested.\n    <\u002Fp>\n\n    <div class=\"sl-foot-row\"><span>SECTION<\u002Fspan><span>01 / 03<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 — The numbers ──────────────────────────────────────── -->\n  <section data-screen-label=\"03 The numbers\" class=\"sl-data\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">[01] CONTEXT · ON THE RECORD<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"sl-reveal\">What is on the public record, and what isn't.<\u002Fh3>\n\n    <div class=\"ms-numgrid\">\n      <div class=\"col sl-reveal sl-reveal-2\">\n        <p class=\"lab\">DHS CLAIMS<\u002Fp>\n        <p class=\"big\">3,000+<\u002Fp>\n        <p class=\"sub\"><strong>Operation Metro Surge arrests<\u002Fstrong>, Minneapolis–St. Paul, Dec 4 2025 → Feb 2026.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vrule\"><\u002Fdiv>\n      <div class=\"col sl-reveal sl-reveal-3\">\n        <p class=\"lab\">DHS PUBLISHES<\u002Fp>\n        <p class=\"big\">335<\u002Fp>\n        <p class=\"sub\">Names on the agency's own <strong>\"Worst of the Worst\" registry.<\u002Fstrong> 11% of the total.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vrule\"><\u002Fdiv>\n      <div class=\"col sl-reveal sl-reveal-4\">\n        <p class=\"lab\">PUBLICLY NAMED<\u002Fp>\n        <p class=\"big dim\">0<\u002Fp>\n        <p class=\"sub\">Federal agents identified as having carried out any of the arrests.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"caption\">FIG. 01 — DHS · \"Worst of the Worst\" registry; Northern News Now (2026·02·09).<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 — Lead: the May 1 order ─────────────────────────────── -->\n  <section data-screen-label=\"04 May 1 order\" class=\"sl-lead\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">[01] CONTEXT · MAY 1, 2026<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h3 class=\"sl-reveal\" style=\"max-width: 36ch;\">A federal judge is doing the investigation nobody else will.<\u002Fh3>\n\n    <div>\n      <div class=\"sl-hairline\"><\u002Fdiv>\n      <p class=\"sl-reveal sl-reveal-2\" style=\"margin-top: 36px; max-width: 56ch;\">\n        Judge Jeffrey M. Bryan ordered DHS to produce one ICE agent's personnel file, body-cam footage, witness statements, medical records, and cell-phone data. It is the first piece of the operation's original record any part of the federal government has put on the public record.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"sl-foot-row\"><span>SECTION 01 / 03<\u002Fspan><span>SLIDE 04 / 09<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 — Section [02] FRAME ────────────────────────────────── -->\n  <section data-screen-label=\"05 Frame divider\" class=\"sl-section\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">PART TWO OF THREE<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"num sl-reveal\">[02]<\u002Fdiv>\n    <h2 class=\"sl-reveal sl-reveal-2\">Frame.<span class=\"sl-caret\"><\u002Fspan><\u002Fh2>\n    <div class=\"sl-hairline\" style=\"max-width: 720px; margin: 8px 0 32px 0;\"><\u002Fdiv>\n    <p class=\"desc sl-reveal sl-reveal-3\">\n      Three accountability layers were dismantled before the operation began.\n      The dismantling is older than the operation.\n    <\u002Fp>\n\n    <div class=\"sl-foot-row\"><span>SECTION<\u002Fspan><span>02 / 03<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 — Three frames: oversight collapse ──────────────────── -->\n  <section data-screen-label=\"06 Three frames\" class=\"sl-frames\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">[02] FRAME · OVERSIGHT, BEFORE<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div class=\"sl-kicker sl-reveal\" style=\"color: var(--tcn-slate-400); margin-bottom: 18px;\">THREE FEDERAL RECORDS ACTIONS · APRIL 2025<\u002Fdiv>\n      <h3 style=\"font-family: var(--font-display); font-size: 64px; line-height: 1.05; letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0; max-width: 26ch;\" class=\"sl-reveal sl-reveal-2\">\n        The retcon needs the record gone first.\n      <\u002Fh3>\n    <\u002Fdiv>\n\n    <div class=\"sl-frames-grid\">\n      <div class=\"sl-frame sl-reveal sl-reveal-2\">\n        <span class=\"n\">[01]<\u002Fspan>\n        <h4>Archive off.<\u002Fh4>\n        <p>DHS turned off automatic text-message archiving in April 2025. NARA ordered an investigation; DHS had not responded as of October 30.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sl-frame sl-reveal sl-reveal-3\">\n        <span class=\"n\">[02]<\u002Fspan>\n        <h4>Watchdog gutted.<\u002Fh4>\n        <p>Office of Civil Rights &amp; Civil Liberties: 147 → fewer than 40 staff. Detention oversight: 118 → 5. One of 32 in-custody deaths investigated.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sl-frame sl-reveal sl-reveal-4\" style=\"border-left-color: var(--tcn-slate-400);\">\n        <span class=\"n\" style=\"color: var(--tcn-slate-400);\">[03]<\u002Fspan>\n        <h4>Data merged.<\u002Fh4>\n        <p>IRS-DHS data-sharing agreement signed; thousands of taxpayer records subsequently found wrongly disclosed. Three actions, one direction.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sl-foot-row\"><span>SECTION 02 / 03<\u002Fspan><span>SLIDE 06 / 09<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 07 — Compare: walks back vs files first ────────────────── -->\n  <section data-screen-label=\"07 Compare\" class=\"sl-compare\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">[02] FRAME · TWO RESPONSES<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <h3 style=\"font-family: var(--font-display); font-size: 72px; line-height: 1.05; letter-spacing: -0.02em; color: var(--tcn-slate-400); margin: 0; max-width: 30ch;\" class=\"sl-reveal\">\n        One agency walks back. Another files first.\n      <\u002Fh3>\n    <\u002Fdiv>\n\n    <div class=\"sl-compare-cols\">\n      <div class=\"sl-compare-col sl-reveal sl-reveal-2\">\n        <h5>FEDERAL · WALK-BACK<\u002Fh5>\n        <h6>\"We never do.\"<\u002Fh6>\n        <p>DOJ Civil Rights Division declined the Renée Good investigation, then opened one for Alex Pretti — same city, same operation, two weeks apart. Six federal prosecutors resigned in protest.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vrule\"><\u002Fdiv>\n      <div class=\"sl-compare-col sl-reveal sl-reveal-3\">\n        <h5>STATE · COUNTER-ARCHITECTURE<\u002Fh5>\n        <h6>\"Who files the second?\"<\u002Fh6>\n        <p>Hennepin DA Moriarty filed first-in-modern-history state assault charges against a federal ICE agent. 14 open investigations. AG Ellison filed <em>Minnesota v. DOJ/DHS<\u002Fem> on the anti-commandeering gap.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"sl-foot-row\"><span>SECTION 02 / 03<\u002Fspan><span>07 / 09<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 08 — Quote pull ─────────────────────────────────────────── -->\n  <section data-screen-label=\"08 Quote\" class=\"sl-quote\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">JUDGE KATHERINE MENENDEZ<\u002Fdiv>\n    <\u002Fdiv>\n\n    <blockquote class=\"sl-reveal\">\n      <div class=\"body\">The consequences are profound and even heartbreaking — difficult to overstate. The Supreme Court has offered little guidance on how anti-commandeering applies when the federal government deploys its own officers directly.<\u002Fdiv>\n      <div class=\"src sl-reveal sl-reveal-2\">— Order denying Minnesota's preliminary injunction · Jan 2026<\u002Fdiv>\n    <\u002Fblockquote>\n\n    <div class=\"sl-foot-row\"><span>SECTION 02 / 03<\u002Fspan><span>08 / 09<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 09 — [03] CALL ─────────────────────────────────────────── -->\n  <section data-screen-label=\"09 Call\" class=\"sl-section\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand\"><span class=\"word\">The Civic Node · №047<\u002Fspan><\u002Fdiv>\n      <div class=\"sl-kicker\">[03] CALL<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"num sl-reveal\">[03]<\u002Fdiv>\n    <h2 class=\"sl-reveal sl-reveal-2\">Watch the doctrine, not the policy.<\u002Fh2>\n    <div class=\"sl-hairline\" style=\"max-width: 720px; margin: 8px 0 32px 0;\"><\u002Fdiv>\n    <p class=\"desc sl-reveal sl-reveal-3\">\n      If a state cannot hold a federal agent accountable for on-duty conduct,\n      and the federal government refuses to investigate, nobody is in charge.\n      That gap predates this operation and will outlast it.\n    <\u002Fp>\n\n    <div class=\"sl-foot-row\"><span>SECTION 03 / 03<\u002Fspan><span>09 / 09<\u002Fspan><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 10 — End-card / disclosure ─────────────────────────────── -->\n  <section data-screen-label=\"10 End\" class=\"sl-end\">\n    <div class=\"sl-mark-row\">\n      <div class=\"sl-mark-brand sl-mark-pulse\">\n        <svg width=\"44\" height=\"48\" viewBox=\"-3 -3 120 130\" fill=\"none\" stroke=\"#557fa3\" stroke-width=\"6\" stroke-linecap=\"round\">\n          <line x1=\"33\" y1=\"0\" x2=\"81\" y2=\"0\"><\u002Fline>\n          <line x1=\"57\" y1=\"0\" x2=\"57\" y2=\"77\"><\u002Fline>\n          <line x1=\"57\" y1=\"77\" x2=\"0\" y2=\"110\"><\u002Fline>\n          <line x1=\"57\" y1=\"77\" x2=\"114\" y2=\"110\"><\u002Fline>\n          <circle class=\"node\" cx=\"57\" cy=\"77\" r=\"14\" fill=\"#557fa3\" stroke=\"none\"><\u002Fcircle>\n        <\u002Fsvg>\n        <span class=\"word\" style=\"color:#557fa3;\">The Civic Node<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sl-kicker\">DISPATCH №047 · END<\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 class=\"sl-reveal\">If I'm wrong, the primary sources are linked — you can check.<\u002Fh2>\n\n    <div class=\"sl-disclosure sl-reveal sl-reveal-2\">\n      <b>Standard disclosure<\u002Fb>\n      No token positions, advisory roles, allocation letters, or sponsored content. If I have an\n      operational relationship with a project or infrastructure mentioned in this piece, it is\n      disclosed in the body before the relevant analysis. If I'm wrong, the primary sources are\n      linked — you can check.\n    <\u002Fdiv>\n\n    <div class=\"sl-end-cta sl-reveal sl-reveal-3\">\n      <span class=\"arr\">→<\u002Fspan>\n      <span class=\"url\">drinkyouroj.substack.com<\u002Fspan>\n      <span style=\"flex:1\"><\u002Fspan>\n      <span style=\"color: var(--tcn-twilight);\">SUBSCRIBE · WEEKLY · NO HYPE<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"Title slide. Hold the mark for a beat, then read the three lines on the title plate slowly — these numbers are the whole frame. Three thousand arrests. Three hundred thirty-five names. One court order. The dispatch is named for what's missing between those numbers, not for what's in them.\",\n  \"Section divider, [01] CONTEXT. Breath beat. The point I want to land before we get into specifics: this story is going to be remembered as an immigration story, and the more interesting question is what it reveals about accountability infrastructure. Hold three seconds.\",\n  \"The numbers slide. Walk left to right. DHS claims more than three thousand arrests in Operation Metro Surge between December and February. Its own Worst of the Worst registry names three hundred thirty-five — that's eleven percent. The agents who carried out any of it are not on a public roster. The zero is the slide.\",\n  \"May 1 lead. Read the headline. Pause. The order from Judge Bryan required DHS to hand over one ICE agent's personnel file, body-cam footage, witness statements, medical records, and cell-phone data. The reason this matters is in the second sentence: it is the first primary document the operation has yielded. Everything before this was statements about the operation. This is from inside it.\",\n  \"Section divider, [02] FRAME. Pause. The frame I'm asking you to hold is that three accountability layers were dismantled before Operation Metro Surge began. The dismantling is older than the operation.\",\n  \"Three frames. April 2025 — same month, three actions, one direction. One: DHS turned off auto-archiving of text messages. Two: the Office of Civil Rights and Civil Liberties was reduced from one-hundred-forty-seven staff to under forty; detention oversight from one-hundred-eighteen to five. Three: the IRS-DHS data-sharing agreement was signed. Reading these as separate stories was always going to age poorly.\",\n  \"Compare. Federal walks back — DOJ declined the Good investigation citing 'we never do' and then opened one for Pretti two weeks later, same city, same operation. Six prosecutors resigned. State files first — Hennepin DA Moriarty brought first-in-modern-history state charges against a federal ICE agent, fourteen open investigations, and AG Ellison filed Minnesota v DOJ/DHS naming the anti-commandeering gap.\",\n  \"Quote. Judge Menendez denied Minnesota's preliminary injunction — but the denial was on a legal gap, not the substance. Read it slowly. The phrase doing the work is 'difficult to overstate.' The legal terrain Minnesota is now testing is exactly the gap the judge named.\",\n  \"[03] CALL. Read the title. Pause. Then the body. The constitutional question is broader than immigration. The policy filling the gap today is immigration. The structural gap predates this operation and will outlast it. Watch the doctrine.\",\n  \"End-card. Read the standard disclosure verbatim — it's part of the brand. End on the URL.\"\n]\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
